name: Tadpole

on:
  pull_request:
    paths:
      - packs/1.21.1/tadpole/**
      - packs/1.21.1/tadpole-server/**
      - flake.nix
      - flake.lock
      - devshell.nix
      - .github/workflows/tadpole.yml
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - packs/1.21.1/tadpole/**
      - packs/1.21.1/tadpole-server/**
      - flake.nix
      - flake.lock
      - devshell.nix
      - .github/workflows/tadpole.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        pack: [tadpole, tadpole-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build Modrinth pack
        working-directory: packs/1.21.1/${{ matrix.pack }}
        shell: bash
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' pack.toml)
          test -n "$version"

          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match pack.toml version $version" >&2
              exit 1
            }
          fi

          nix develop ../../.. --command packwiz refresh
          git diff --exit-code -- pack.toml index.toml
          mkdir -p ../../../dist
          nix develop ../../.. --command packwiz modrinth export \
            --output "../../../dist/${{ matrix.pack }}.mrpack"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pack }}-mrpack
          path: dist/*.mrpack

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-mrpack'
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.mrpack --repo "$GITHUB_REPOSITORY" --generate-notes --title "Tadpole ${GITHUB_REF_NAME#v}"
